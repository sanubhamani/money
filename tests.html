<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money checks</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .pass { color: #138A5B; } .fail { color: #D2392E; font-weight: 700; }
    li { margin: 3px 0; } h1 { font-size: 22px; }
  </style>
</head>
<body>
  <h1 id="sum">Running…</h1>
  <ol id="out"></ol>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/badges.js"></script>
  <script>
  (function () {
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const near = (a, b) => Math.abs(a - b) < 1e-6;
    function check(name, ok, detail) {
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? '✓ ' : '✕ ') + name + (ok ? '' : '  → ' + JSON.stringify(detail));
      out.appendChild(li);
      ok ? pass++ : fail++;
    }
    const base = () => ({
      ...Store.empty(),
      categories: [{ id: 'food', name: 'Food', budget: 10000 }, { id: 'bills', name: 'Bills', budget: 5000 }],
    });
    let n = 0;
    const spend = (d, catId, amount, date) => d.entries.push({ id: 'e' + n++, catId, amount, date });
    const save = (d, goalId, amount, date) => d.savings.push({ id: 's' + n++, goalId, amount, date });
    const cat = (B, id) => B.categories.find((c) => c.id === id);

    // ---- Many small entries add up ----
    let d = base();
    [500, 1200, 300, 2000, 750, 250, 1000, 600, 400, 1000].forEach((a, i) => spend(d, 'food', a, `2026-10-0${(i % 9) + 1}`));
    let B = Calc.monthBudget(d, '2026-10-09');
    check('10 food entries add up to 8,000', cat(B, 'food').spent === 8000, cat(B, 'food'));
    check('Left = 15,000 − 8,000 = 7,000', B.left === 7000, B.left);

    // ---- Overspending ----
    spend(d, 'bills', 6500, '2026-10-05');
    spend(d, 'food', 1000, '2026-10-06');
    B = Calc.monthBudget(d, '2026-10-09');
    check('Bills over by 1,500, shown as −1,500', cat(B, 'bills').left === -1500 && cat(B, 'bills').status === 'over', cat(B, 'bills'));
    check('Total over: left is −500', B.left === -500 && B.status === 'over', B.left);

    // ---- New month starts at zero ----
    d = base();
    spend(d, 'food', 9000, '2026-09-30');
    spend(d, 'food', 400, '2026-10-01');
    B = Calc.monthBudget(d, '2026-10-02');
    check('30 Sept spending is not counted in October', cat(B, 'food').spent === 400, cat(B, 'food'));
    check('Last month total is remembered (9,000)', Calc.lastMonthSpent(d.entries, '2026-10-02') === 9000, Calc.lastMonthSpent(d.entries, '2026-10-02'));
    check('Budgets carry over to the new month', cat(B, 'food').budget === 10000, cat(B, 'food'));
    check('January looks back to December', Calc.prevMonth('2027-01-15') === '2026-12', Calc.prevMonth('2027-01-15'));

    // ---- Zero budget ----
    d = base(); d.categories.push({ id: 'gifts', name: 'Gifts', budget: 0 });
    B = Calc.monthBudget(d, '2026-10-09');
    check('Zero budget, nothing spent → “none”, no crash', cat(B, 'gifts').status === 'none', cat(B, 'gifts'));
    spend(d, 'gifts', 500, '2026-10-03');
    B = Calc.monthBudget(d, '2026-10-09');
    check('Zero budget with spending → “over”', cat(B, 'gifts').status === 'over' && cat(B, 'gifts').left === -500, cat(B, 'gifts'));
    d.categories = [{ id: 'x', name: 'X', budget: 0 }];
    check('All-zero budget → pace “none”, no NaN', Calc.monthBudget(d, '2026-10-09').pace.state === 'none', Calc.monthBudget(d, '2026-10-09').pace);

    // ---- Pace ----
    let p = Calc.pace(31000, 15000, '2026-10-15');
    check('Pace: day 15 of 31, spent 15,000 of 31,000 → even', p.state === 'even' && near(p.expected, 15000), p);
    p = Calc.pace(30000, 20000, '2026-09-10');
    check('Pace: 67% spent by day 10 of 30 → fast', p.state === 'fast', p);
    p = Calc.pace(28000, 2000, '2026-02-14');
    check('Pace: February has 28 days, low spend → slow', p.state === 'slow' && p.daysInMonth === 28, p);

    // ---- Savings ----
    d = base(); d.goals = [{ id: 'lap', name: 'Laptop', target: 100000, deadline: '2026-12-18' }];
    save(d, 'lap', 15000, '2026-08-20'); save(d, 'lap', 25000, '2026-10-01');
    let g = Calc.goals(d, '2026-10-09')[0];
    check('Savings add up across months (40,000)', g.saved === 40000 && near(g.share, 0.4), g);
    check('70 days left → 6,000 a week', g.daysLeft === 70 && near(g.weeklyNeeded, 6000), g);
    spend(d, 'food', 1000, '2026-10-02');
    check('Budget left over is not counted as savings', Calc.goals(d, '2026-10-09')[0].saved === 40000, Calc.goals(d, '2026-10-09')[0]);
    save(d, 'lap', 70000, '2026-10-09');
    g = Calc.goals(d, '2026-10-09')[0];
    check('Completed goal: done, nothing left, no weekly amount', g.done && g.remaining === 0 && g.weeklyNeeded === null, g);
    d.goals.push({ id: 'trip', name: 'Trip', target: 50000, deadline: null });
    check('Missing deadline: no weekly amount, no error', Calc.goals(d, '2026-10-09')[1].weeklyNeeded === null, Calc.goals(d, '2026-10-09')[1]);
    d.goals.push({ id: 'old', name: 'Old', target: 50000, deadline: '2026-10-01' });
    check('Past deadline → “passed”', Calc.goals(d, '2026-10-09')[2].deadlineState === 'passed', Calc.goals(d, '2026-10-09')[2]);
    g = Calc.goalSummary({ name: 'Gift', target: 5000, saved: 4100, deadline: '2026-10-12' }, '2026-10-09');
    check('3 days left → whole 900 needed this week', near(g.weeklyNeeded, 900), g);

    const hist = Calc.savingsOverTime([{ amount: 1000, date: '2026-09-20' }, { amount: 500, date: '2026-10-05' }], '2026-10-09');
    check('Weekly chart: totals build up, latest 1,500', hist[hist.length - 1].saved === 1500 && hist.every((h, i) => i === 0 || h.saved >= hist[i - 1].saved), hist);
    check('Weekly chart hidden with no savings', Calc.savingsOverTime([], '2026-10-09').length === 0, Calc.savingsOverTime([], '2026-10-09'));

    // ---- Saving and loading ----
    const st = Store.create(Store.memoryStorage());
    d = base(); spend(d, 'food', 500, '2026-10-03');
    st.save(d);
    check('Entries are remembered after closing the app', st.load().entries.length === 1 && st.load().entries[0].amount === 500, st.load());
    const file = Store.backupFile(d, '2026-10-09');
    const back = Store.validate(JSON.parse(file.body));
    check('Backup file loads back the same numbers', back && back.entries[0].amount === 500 && back.categories.length === 2, back);
    check('Backup file name has the date', file.name === 'money-backup-2026-10-09.json', file.name);
    check('A random file is rejected as a backup', Store.validate({ hello: 1 }) === null && Store.validate({ categories: [], goals: [], entries: [{ id: 'a', catId: 'x', amount: -5, date: '2026-10-01' }], savings: [] }) === null, 'should be null');
    const broken = Store.memoryStorage(); broken.setItem(Store.KEY, '{not json');
    check('Damaged saved data opens as a fresh start, no crash', Store.create(broken).load().categories.length === 0, 'ok');

    // ---- Badges ----
    d = base();
    let b = Badges.status(d, '2026-10-09');
    check('No badges before anything is added', b.every((x) => !x.earned), b);
    spend(d, 'food', 100, '2026-10-01');
    check('First entry earns “First step”', Badges.status(d, '2026-10-09').find((x) => x.id === 'first').earned, 'not earned');
    for (let i = 2; i <= 7; i++) spend(d, 'food', 100, `2026-10-0${i}`);
    check('7 different days earns “Tracker”', Badges.status(d, '2026-10-09').find((x) => x.id === 'tracker').earned, 'not earned');
    spend(d, 'food', 3000, '2026-09-12');
    check('September under budget earns “Under budget”', Badges.status(d, '2026-10-09').find((x) => x.id === 'month').earned, 'not earned');
    const d2 = base(); spend(d2, 'food', 20000, '2026-09-12');
    check('September over budget does not', !Badges.status(d2, '2026-10-09').find((x) => x.id === 'month').earned, 'earned');
    check('Current month never counts for “Under budget”', !Badges.status(base(), '2026-10-09').find((x) => x.id === 'month').earned, 'earned');
    check('Milestone: 40% → 55% crosses 50%', Badges.milestoneCrossed(100, 40, 55) === 0.5, Badges.milestoneCrossed(100, 40, 55));
    check('Milestone: 90% → 100% is the goal', Badges.milestoneCrossed(100, 90, 100) === 1, Badges.milestoneCrossed(100, 90, 100));
    check('Milestone: 10% → 20% crosses nothing', Badges.milestoneCrossed(100, 10, 20) === null, Badges.milestoneCrossed(100, 10, 20));

    const sum = document.getElementById('sum');
    sum.textContent = fail ? `${fail} failed, ${pass} passed` : `All ${pass} checks passed`;
    sum.className = fail ? 'fail' : 'pass';
  })();
  </script>
</body>
</html>
