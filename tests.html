<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money checks</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .pass { color: #138A5B; } .fail { color: #D2392E; font-weight: 700; }
    li { margin: 3px 0; } h1 { font-size: 22px; }
  </style>
</head>
<body>
  <h1 id="sum">Running…</h1>
  <ol id="out"></ol>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/store.js"></script>
  <script>
  (async function () {
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const near = (a, b) => Math.abs(a - b) < 1e-6;
    function check(name, ok, detail) {
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? '✓ ' : '✕ ') + name + (ok ? '' : '  → ' + JSON.stringify(detail));
      out.appendChild(li);
      ok ? pass++ : fail++;
    }
    const snap = (date, budget, goals = []) => ({ date, currency: 'PKR', budget, goals });

    // ---- Budget maths ----
    let B = Calc.budgetSummary(snap('2026-10-09', [{ name: 'Food', budget: 10000, spent: 6000 }, { name: 'Bills', budget: 5000, spent: 2000 }]));
    check('Left = 15,000 budget − 8,000 spent = 7,000', B.left === 7000, B);
    check('Used share = 8,000 / 15,000', near(B.share, 8000 / 15000), B.share);

    B = Calc.budgetSummary(snap('2026-10-09', [{ name: 'Shopping', budget: 5000, spent: 6500 }, { name: 'Food', budget: 3000, spent: 2000 }]));
    check('Overspend: left shows −500', B.left === -500, B.left);
    check('Overspent category is “over” with −1,500 left', B.categories[0].status === 'over' && B.categories[0].left === -1500, B.categories[0]);
    check('Total status is “over”', B.status === 'over', B.status);

    B = Calc.budgetSummary(snap('2026-10-09', [{ name: 'Gym', budget: 0, spent: 0 }, { name: 'Gifts', budget: 0, spent: 500 }]));
    check('Zero budget, nothing spent → “none”, no crash', B.categories[0].status === 'none' && B.categories[0].share === 0, B.categories[0]);
    check('Zero budget with spending → “over”', B.categories[1].status === 'over' && B.categories[1].left === -500, B.categories[1]);
    check('All-zero budget → pace “none”, no NaN', B.pace.state === 'none' && !Number.isNaN(B.left), B.pace);

    B = Calc.budgetSummary(snap('2026-10-09', [{ name: 'Food', budget: 1000, spent: 900 }]));
    check('90% used → “close”', B.categories[0].status === 'close', B.categories[0].status);

    // ---- Pace ----
    let p = Calc.pace(31000, 15000, '2026-10-15');
    check('Pace: day 15 of 31, spent 15,000 of 31,000 → even', p.state === 'even' && near(p.expected, 15000) && p.daysInMonth === 31, p);
    p = Calc.pace(30000, 20000, '2026-09-10');
    check('Pace: 67% spent by day 10 of 30 → fast', p.state === 'fast' && p.daysInMonth === 30, p);
    p = Calc.pace(28000, 2000, '2026-02-14');
    check('Pace: February has 28 days, low spend → slow', p.state === 'slow' && p.daysInMonth === 28, p);

    // ---- Savings ----
    let g = Calc.goalSummary({ name: 'Laptop', target: 100000, saved: 40000, deadline: '2026-12-18' }, '2026-10-09');
    check('Goal 40% there', near(g.share, 0.4), g.share);
    check('70 days left → 10 weeks → 6,000 a week', g.daysLeft === 70 && near(g.weeklyNeeded, 6000), g);
    g = Calc.goalSummary({ name: 'Fund', target: 100000, saved: 120000, deadline: '2026-12-01' }, '2026-10-09');
    check('Completed goal: done, nothing left, no weekly amount', g.done && g.remaining === 0 && g.weeklyNeeded === null && g.deadlineState === 'done', g);
    g = Calc.goalSummary({ name: 'Trip', target: 50000, saved: 10000, deadline: null }, '2026-10-09');
    check('Missing deadline: no weekly amount, no error', g.weeklyNeeded === null && g.deadlineState === 'none', g);
    g = Calc.goalSummary({ name: 'Trip', target: 50000, saved: 10000, deadline: '2026-10-01' }, '2026-10-09');
    check('Past deadline → “passed”', g.deadlineState === 'passed' && g.weeklyNeeded === null, g);
    g = Calc.goalSummary({ name: 'Gift', target: 5000, saved: 4100, deadline: '2026-10-12' }, '2026-10-09');
    check('3 days left → whole 900 needed this week', near(g.weeklyNeeded, 900), g);
    g = Calc.goalSummary({ name: 'Idea', target: 0, saved: 0, deadline: null }, '2026-10-09');
    check('Zero target → “no target”, share 0, no crash', g.noTarget && g.share === 0, g);

    const s1 = snap('2026-10-09', [{ name: 'Food', budget: 10000, spent: 1000 }], [{ name: 'Laptop', target: 100000, saved: 20000, deadline: null }]);
    check('Budget left (9,000) is not counted as savings', Calc.savingsSummary(s1).saved === 20000, Calc.savingsSummary(s1));

    // ---- Repeated uploads ----
    const st = Store.create(Store.memoryStorage());
    let r = st.save(snap('2026-10-02', [], [{ name: 'L', target: 100, saved: 10 }]));
    check('First upload is new', r.replaced === false, r);
    r = st.save(snap('2026-10-09', [], [{ name: 'L', target: 100, saved: 30 }]));
    r = st.save(snap('2026-10-09', [], [{ name: 'L', target: 100, saved: 35 }]));
    check('Same date uploaded again → replaced', r.replaced === true, r);
    const hist = Calc.savingsHistory(st.all());
    check('Only one snapshot per date', Object.keys(st.all()).length === 2, Object.keys(st.all()));
    check('Replaced total is 35, not 30 + 35', hist[1].saved === 35, hist);
    check('History is in date order: 10 then 35', hist[0].saved === 10 && hist[1].saved === 35, hist);
    st.save(snap('2026-09-25', [], [{ name: 'L', target: 100, saved: 5 }]));
    check('Older upload becomes current, history still sorted', st.current().date === '2026-09-25' && Calc.savingsHistory(st.all())[0].date === '2026-09-25', st.current());

    // ---- Reading Excel ----
    const toWb = (sheets) => {
      const wb = XLSX.utils.book_new();
      for (const [name, aoa] of Object.entries(sheets)) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
      return XLSX.read(XLSX.write(wb, { type: 'array', bookType: 'xlsx' }), { type: 'array' });
    };
    const good = () => ({
      Budget: [['Snapshot Date', '2026-10-09'], ['Currency', 'PKR'], [], ['Category', 'Monthly Budget', 'Spent So Far'], ['Food', 15000, 9800], ['Bills', '12,000', ''], []],
      Savings: [['Goal Name', 'Target Amount', 'Amount Saved', 'Goal Deadline'], ['Laptop', 150000, 62000, '2027-03-31'], ['Fund', 50000, 50000, null]],
    });

    try {
      const buf = await (await fetch('template/Budget-Template.xlsx')).arrayBuffer();
      const res = Parse.parseWorkbook(XLSX.read(buf, { type: 'array' }));
      check('Template file reads cleanly', res.ok && res.snapshot.date === '2026-10-09' && res.snapshot.currency === 'PKR' && res.snapshot.budget.length === 5 && res.snapshot.goals.length === 2, res);
      check('Template deadline read as 2027-03-31, blank deadline as none', res.ok && res.snapshot.goals[0].deadline === '2027-03-31' && res.snapshot.goals[1].deadline === null, res.snapshot && res.snapshot.goals);
    } catch (e) { check('Template file reads cleanly', false, String(e)); }

    let res = Parse.parseWorkbook(toWb(good()));
    check('Good file: “12,000” text read as 12000, blank spent as 0', res.ok && res.snapshot.budget[1].budget === 12000 && res.snapshot.budget[1].spent === 0, res);

    let d = good(); d.Budget[1][1] = 'usd';
    res = Parse.parseWorkbook(toWb(d));
    check('Currency can change (usd → USD)', res.ok && res.snapshot.currency === 'USD', res);

    d = good(); d.Budget[1][1] = 'Rupees';
    res = Parse.parseWorkbook(toWb(d));
    check('Bad currency → clear message', !res.ok && /Currency/.test(res.errors[0]), res.errors);

    d = good(); delete d.Savings;
    res = Parse.parseWorkbook(toWb(d));
    check('Missing Savings sheet → clear message', !res.ok && res.errors.some((e) => /Savings/.test(e)), res.errors);

    d = good(); d.Budget[0][1] = null;
    res = Parse.parseWorkbook(toWb(d));
    check('Missing snapshot date → clear message', !res.ok && res.errors.some((e) => /Snapshot Date is missing/.test(e)), res.errors);

    d = good(); d.Budget[0][1] = '31/31/2026';
    res = Parse.parseWorkbook(toWb(d));
    check('Unreadable date → clear message', !res.ok && res.errors.some((e) => /isn’t a date/.test(e)), res.errors);

    d = good(); d.Budget[4][2] = 'lots';
    res = Parse.parseWorkbook(toWb(d));
    check('Text in Spent So Far → names the category', !res.ok && res.errors.some((e) => /^Food: Spent So Far “lots”/.test(e)), res.errors);

    d = good(); d.Budget[4][1] = -10;
    res = Parse.parseWorkbook(toWb(d));
    check('Negative budget → clear message', !res.ok && res.errors.some((e) => /negative/.test(e)), res.errors);

    d = good(); d.Budget.push(['food', 100, 1]);
    res = Parse.parseWorkbook(toWb(d));
    check('Same category twice → clear message', !res.ok && res.errors.some((e) => /listed twice/.test(e)), res.errors);

    d = good(); d.Budget[3] = ['Category', 'Budget Amount', 'Spent So Far'];
    res = Parse.parseWorkbook(toWb(d));
    check('Missing Monthly Budget column → clear message', !res.ok && res.errors.some((e) => /Monthly Budget/.test(e)), res.errors);

    d = good(); d.Savings[1][3] = 'someday';
    res = Parse.parseWorkbook(toWb(d));
    check('Bad goal deadline → clear message', !res.ok && res.errors.some((e) => /Goal Deadline/.test(e)), res.errors);

    d = good(); d.Savings = [['Goal Name', 'Target Amount', 'Amount Saved', 'Goal Deadline']];
    res = Parse.parseWorkbook(toWb(d));
    check('No goals yet is allowed', res.ok && res.snapshot.goals.length === 0, res);

    check('Date formats: 9 Oct 2026, Oct 9, 2026, Excel serial', Parse.toISODate('9 Oct 2026') === '2026-10-09' && Parse.toISODate('Oct 9, 2026') === '2026-10-09' && Parse.toISODate(46304) === '2026-10-09', [Parse.toISODate('9 Oct 2026'), Parse.toISODate('Oct 9, 2026'), Parse.toISODate(46304)]);

    const sum = document.getElementById('sum');
    sum.textContent = fail ? `${fail} failed, ${pass} passed` : `All ${pass} checks passed`;
    sum.className = fail ? 'fail' : 'pass';
    window.__result = { pass, fail };
  })();
  </script>
</body>
</html>
