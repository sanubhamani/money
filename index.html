<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money</title>
  <meta name="description" content="A private budget and savings app. Type what you spend; your numbers stay on your phone.">
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E13" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Money">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Money</h1>
      <span class="asof" id="month">—</span>
    </div>
    <button class="text-btn" id="settingsBtn">Settings</button>
  </header>

  <p class="banner warn" id="storageBanner" hidden>This browser won’t save your numbers. Private mode may be on.</p>
  <button class="banner nudge" id="backupBanner" hidden>
    <span class="banner-tag">Tip</span> Save a backup so you never lose your numbers.
  </button>

  <main class="layout" id="setup" hidden></main>

  <main class="layout" id="dash" hidden>
    <div class="col">
      <button class="card hero" id="hero"></button>
      <section class="block" aria-labelledby="spendTitle">
        <h2 class="section-title" id="spendTitle">Spending <span class="section-hint">Tap to add</span></h2>
        <div class="cats" id="cats"></div>
      </section>
      <button class="card pace" id="pace" aria-label="Pace check. Tap for details."></button>
    </div>
    <div class="col">
      <section class="block" aria-labelledby="savingsTitle">
        <h2 class="section-title" id="savingsTitle">Savings</h2>
        <div class="goals" id="goals"></div>
        <div class="card chart-card" id="chart" hidden></div>
      </section>
      <button class="card badges" id="badges"></button>
      <p class="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Private. Your numbers stay on this phone and nobody else can see them.
      </p>
    </div>
  </main>

  <div class="dock" hidden>
    <button class="primary" id="addBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add spending
    </button>
  </div>

  <dialog class="sheet" id="sheet" aria-label="Details">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheetBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
